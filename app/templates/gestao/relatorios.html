{% extends "base.html" %}

{% block content %}
<div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
    <div>
        <h3 class="fw-bold mb-3"><i class="fas fa-file-alt text-primary me-2"></i> Relatórios de Produção</h3>
        <h6 class="op-7 mb-2">Geração de extratos e relatórios dinâmicos.</h6>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="card-title fw-bold">Filtros de Exportação</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('relatorios.gerador') }}" target="_blank" id="formRelatorio">
                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Data Inicial</label>
                            <input type="date" class="form-control" name="data_inicio">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Data Final</label>
                            <input type="date" class="form-control" name="data_fim">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Setor</label>
                            <select class="form-select" name="setor_id">
                                <option value="">Todos os Setores</option>
                                {% for setor in setores %}
                                    <option value="{{ setor.id }}">{{ setor.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Colaborador</label>
                            <select class="form-select" name="usuario_id">
                                <option value="">Todos os Colaboradores</option>
                                {% for user in usuarios %}
                                    <option value="{{ user.id }}">{{ user.nome_completo }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4 border-top pt-4">
                        <!-- Exportar Excel -->
                        <button type="submit" name="acao" value="excel" class="btn btn-success rounded-pill fw-bold px-4" onclick="document.getElementById('formRelatorio').target=''">
                            <i class="fas fa-file-excel me-2"></i> Baixar Excel (.xlsx)
                        </button>
                        
                        <!-- Imprimir / PDF -->
                        <button type="submit" name="acao" value="pdf" class="btn btn-danger rounded-pill fw-bold px-4" onclick="document.getElementById('formRelatorio').target='_blank'">
                            <i class="fas fa-file-pdf me-2"></i> Imprimir / PDF
                        </button>
                        
                        <!-- Gerar Texto WhatsApp -->
                        <button type="submit" name="acao" value="whatsapp" class="btn btn-success rounded-pill fw-bold px-4" style="background-color: #25D366; border-color: #25D366;" onclick="document.getElementById('formRelatorio').target=''">
                            <i class="fab fa-whatsapp me-2"></i> Formato WhatsApp
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal para exibir o texto do WhatsApp caso tenha sido gerado -->
{% if texto_wpp %}
<div class="modal fade show d-block" id="whatsappModal" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0">
            <div class="modal-header bg-light border-bottom-0">
                <h5 class="modal-title fw-bold"><i class="fab fa-whatsapp text-success me-2"></i> Texto para WhatsApp</h5>
                <a href="{{ url_for('relatorios.gerador') }}" class="btn-close"></a>
            </div>
            <div class="modal-body p-4">
                <textarea id="textoWppArea" class="form-control" rows="12" readonly style="resize: none;">{{ texto_wpp }}</textarea>
            </div>
            <div class="modal-footer border-top-0">
                <a href="{{ url_for('relatorios.gerador') }}" class="btn btn-outline-secondary rounded-pill">Fechar</a>
                <button type="button" class="btn btn-primary rounded-pill fw-bold px-4" onclick="copiarTexto()">
                    <i class="fas fa-copy me-2"></i> Copiar Texto
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function copiarTexto() {
        var copyText = document.getElementById("textoWppArea");
        copyText.select();
        copyText.setSelectionRange(0, 99999); // Para mobile
        navigator.clipboard.writeText(copyText.value).then(() => {
            alert("Texto copiado para a área de transferência!");
        });
    }
</script>
{% endif %}
{% endblock %}
