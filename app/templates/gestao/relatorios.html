{% extends "base.html" %}
{% block content %}

<div class="mx-auto max-w-5xl" x-data="{ copySuccess: false }">

    <!-- PAGE HEADER -->
    <div class="mb-6">
        <h3 class="text-2xl font-bold text-slate-800 dark:text-white">
            Relatórios de Produção
        </h3>
        <p class="text-sm text-slate-500 dark:text-slate-400">
            Geração de extratos e relatórios dinâmicos.
        </p>
    </div>

    <!-- MAIN FILTER CARD -->
    <div class="tailwind-card p-6 md:p-8 mb-8">
        <div class="mb-6 border-b border-slate-100 pb-4 dark:border-slate-800 flex items-center justify-between">
            <h5 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-filter text-blue-600"></i>
                Filtros de Exportação
            </h5>
            <span class="text-xs text-slate-400">
                Selecione o período e parâmetros
            </span>
        </div>

        <form method="GET" action="" class="space-y-6">
            
            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
                
                <!-- DATA INICIAL -->
                <div>
                    <label for="data_inicio" class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">
                        Data Inicial
                    </label>
                    <input type="date" id="data_inicio" name="data_inicio" value="{{ request.args.get('data_inicio', '') }}"
                           class="form-input-tailwind">
                </div>

                <!-- DATA FINAL -->
                <div>
                    <label for="data_fim" class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">
                        Data Final
                    </label>
                    <input type="date" id="data_fim" name="data_fim" value="{{ request.args.get('data_fim', '') }}"
                           class="form-input-tailwind">
                </div>

                <!-- SETOR -->
                <div>
                    <label for="setor_id" class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">
                        Setor
                    </label>
                    <select id="setor_id" name="setor_id" class="form-input-tailwind">
                        <option value="">Todos os Setores</option>
                        {% for setor in setores %}
                            <option value="{{ setor.id }}" {% if request.args.get('setor_id')|int == setor.id %}selected{% endif %}>
                                {{ setor.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- COLABORADOR -->
                <div>
                    <label for="usuario_id" class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">
                        Colaborador
                    </label>
                    <select id="usuario_id" name="usuario_id" class="form-input-tailwind">
                        <option value="">Todos os Colaboradores</option>
                        {% for user in usuarios %}
                            <option value="{{ user.id }}" {% if request.args.get('usuario_id')|int == user.id %}selected{% endif %}>
                                {{ user.nome_completo }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

            </div>

            <!-- EXPORT ACTION BUTTONS -->
            <div class="flex flex-wrap items-center justify-end gap-3 border-t border-slate-100 pt-6 dark:border-slate-800">
                <button type="submit" name="exportar" value="excel" 
                        class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white shadow hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-file-excel"></i>
                    Baixar Excel (.xlsx)
                </button>

                <button type="submit" name="exportar" value="impressao" formtarget="_blank"
                        class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-print"></i>
                    Imprimir / PDF
                </button>

                <button type="submit" name="exportar" value="whatsapp" 
                        class="inline-flex items-center gap-2 rounded-lg bg-emerald-500 px-5 py-2.5 text-sm font-medium text-white shadow hover:bg-emerald-600 transition">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    Formato WhatsApp
                </button>
            </div>

        </form>
    </div>

    <!-- WHATSAPP TEXT RESULT SECTION -->
    {% if texto_wpp %}
    <div class="tailwind-card p-6 md:p-8">
        <div class="mb-4 flex items-center justify-between border-b border-slate-100 pb-3 dark:border-slate-800">
            <h5 class="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <i class="fa-brands fa-whatsapp text-emerald-500 text-lg"></i>
                Texto para WhatsApp
            </h5>
            <span class="text-xs text-slate-400">Pronto para copiar e colar</span>
        </div>

        <div class="relative">
            <textarea id="texto_whatsapp" rows="12" readonly
                      class="w-full rounded-lg border border-slate-200 bg-slate-50 p-4 font-mono text-xs text-slate-800 focus:outline-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200">{{ texto_wpp }}</textarea>
        </div>

        <div class="mt-4 flex items-center justify-end gap-3">
            <a href="{{ url_for('relatorios.gerador') }}" 
               class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-600 dark:text-slate-300 transition">
                Fechar
            </a>
            <button type="button" 
                    @click="navigator.clipboard.writeText(document.getElementById('texto_whatsapp').value); copySuccess = true; setTimeout(() => copySuccess = false, 3000)"
                    class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-5 py-2 text-sm font-medium text-white hover:bg-blue-700 transition shadow">
                <i class="fa-solid fa-copy"></i>
                <span x-text="copySuccess ? 'Copiado!' : 'Copiar Texto'">Copiar Texto</span>
            </button>
        </div>
    </div>
    {% endif %}

</div>

{% endblock %}
