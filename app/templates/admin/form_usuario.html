{% extends "base.html" %}
{% block content %}

<div class="mx-auto max-w-4xl">
    
    <!-- HEADER & BREADCRUMB -->
    <div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h3 class="text-2xl font-bold text-slate-800 dark:text-white">
                Editar Usuário
            </h3>
            <nav class="flex text-sm text-slate-500 dark:text-slate-400">
                <a href="{{ url_for('admin.listar_usuarios') }}" class="hover:text-blue-600">Usuários</a>
                <span class="mx-2">•</span>
                <span class="text-slate-800 dark:text-slate-200">Editar</span>
            </nav>
        </div>
    </div>

    <!-- USER IDENTITY SUMMARY CARD -->
    <div class="tailwind-card mb-6 p-6 flex items-center gap-5">
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-blue-600 text-2xl font-bold text-white shadow">
            {{ usuario.username[0]|upper }}
        </div>
        <div>
            <h4 class="text-xl font-bold text-slate-900 dark:text-white">
                {{ usuario.nome_completo }}
            </h4>
            <p class="text-sm text-slate-500 dark:text-slate-400">
                {{ usuario.email }}
            </p>
        </div>
    </div>

    <!-- EDIT FORM CARD -->
    <div class="tailwind-card p-6 md:p-8">
        <form method="POST" action="" class="space-y-8">
            
            <!-- SEÇÃO 1: INFORMAÇÕES PROFISSIONAIS -->
            <div>
                <h4 class="text-base font-semibold text-slate-900 border-b border-slate-200 pb-2 mb-4 dark:text-white dark:border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-id-badge text-blue-600"></i>
                    Informações Profissionais
                </h4>

                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label for="nome_completo" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                            Nome Completo
                        </label>
                        <input type="text" id="nome_completo" name="nome_completo"
                               value="{{ usuario.nome_completo }}"
                               class="form-input-tailwind">
                    </div>

                    <div>
                        <label for="cargo" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                            Cargo / Função
                        </label>
                        <input type="text" id="cargo" name="cargo"
                               value="{{ usuario.cargo or '' }}"
                               class="form-input-tailwind">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                            E-mail Corporativo
                        </label>
                        <input type="email" id="email" name="email"
                               value="{{ usuario.email }}"
                               class="form-input-tailwind">
                    </div>

                    <div>
                        <label for="setor_id" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                            Setor de Lotação
                        </label>
                        <select id="setor_id" name="setor_id" class="form-input-tailwind">
                            {% for setor in setores %}
                                <option value="{{ setor.id }}" {% if usuario.setor_id == setor.id %}selected{% endif %}>
                                    {{ setor.nome }} ({{ setor.sigla }})
                                </option>
                            {% endfor %}
                        </select>
                        <span class="mt-1 block text-xs text-slate-400">
                            Define as atividades visíveis no painel.
                        </span>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 2: PERMISSÕES E SEGURANÇA -->
            <div>
                <h4 class="text-base font-semibold text-slate-900 border-b border-slate-200 pb-2 mb-4 dark:text-white dark:border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-blue-600"></i>
                    Permissões e Segurança
                </h4>

                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <div>
                        <label for="role" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                            Perfil de Acesso
                        </label>
                        <select id="role" name="role" class="form-input-tailwind">
                            <option value="operador" {% if usuario.role == 'operador' %}selected{% endif %}>Operador</option>
                            <option value="coordenador" {% if usuario.role == 'coordenador' %}selected{% endif %}>Coordenador</option>
                            <option value="gestor" {% if usuario.role == 'gestor' %}selected{% endif %}>Gestor</option>
                            <option value="admin" {% if usuario.role == 'admin' %}selected{% endif %}>Administrador</option>
                        </select>
                    </div>

                    <div class="flex items-center pt-6">
                        <label class="relative inline-flex items-center cursor-pointer gap-3">
                            <input type="checkbox" name="ativo" value="1" {% if usuario.ativo %}checked{% endif %} class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-blue-600"></div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Conta Ativa</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-200 pt-6 dark:border-slate-700">
                <button type="button" class="w-full sm:w-auto rounded-lg border border-amber-300 bg-amber-50 px-4 py-2 text-xs font-semibold text-amber-800 hover:bg-amber-100 transition">
                    <i class="fa-solid fa-key mr-1"></i> Redefinir Senha
                </button>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                    <a href="{{ url_for('admin.listar_usuarios') }}" 
                       class="rounded-lg border border-slate-300 px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-600 dark:text-slate-300 transition">
                        Cancelar
                    </a>
                    <button type="submit" 
                            class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-6 py-2.5 text-sm font-medium text-white hover:bg-blue-700 transition shadow">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Salvar Alterações
                    </button>
                </div>
            </div>

        </form>
    </div>

</div>

{% endblock %}
