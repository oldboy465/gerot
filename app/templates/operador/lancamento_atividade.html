{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-6">
            
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white py-3 rounded-top-4">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-stopwatch me-2"></i> Apontamento de Produção</h5>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('operacao.novo_lancamento') }}" class="needs-validation" novalidate>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Atividade *</label>
                            <select class="form-select form-select-lg" name="atividade_id" required>
                                <option value="" selected disabled>Selecione a atividade executada...</option>
                                {% for atv in atividades %}
                                    <option value="{{ atv.id }}">{{ atv.titulo }} (SLA: {{ atv.tempo_convertido_minutos }} min)</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Cronologia / Recorrência *</label>
                            <select class="form-select" name="cronologia" required>
                                <option value="Diário" selected>Diário (Rotina comum)</option>
                                <option value="Semanal">Semanal</option>
                                <option value="Quinzenal">Quinzenal</option>
                                <option value="Mensal">Mensal</option>
                                <option value="Bimestral">Bimestral</option>
                                <option value="Trimestral">Trimestral</option>
                                <option value="Quadrimestral">Quadrimestral</option>
                                <option value="Semestral">Semestral</option>
                                <option value="Anual">Anual</option>
                            </select>
                            <div class="form-text">Para cronologias longas, o sistema não acusará conflito rígido de horário.</div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Início *</label>
                                <input type="datetime-local" class="form-control" name="data_hora_inicio" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Término *</label>
                                <input type="datetime-local" class="form-control" name="data_hora_fim" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Observações / Detalhes da Entrega</label>
                            <textarea class="form-control" name="observacao" rows="3" placeholder="Insira detalhes relevantes sobre a execução desta atividade..."></textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="{{ url_for('operacao.painel') }}" class="btn btn-light btn-lg px-4 me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-success btn-lg px-5 fw-bold">
                                <i class="fas fa-save me-2"></i> Registrar Produção
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
